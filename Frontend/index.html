<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link id="dynamic-favicon" rel="icon" type="image/webp" href="https://res.cloudinary.com/zq7yx874/image/upload/v1790234720/haiquan_web/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        const updateFavicon = () => {
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const link = document.getElementById('dynamic-favicon');
          
          if (!link.dataset.originalHref) {
            link.dataset.originalHref = link.href;
          }

          if (!isDark) {
            link.href = link.dataset.originalHref;
            return;
          }

          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            
            // Invert colors to make it bright for dark mode
            ctx.filter = 'brightness(0) invert(1)';
            ctx.drawImage(img, 0, 0);
            
            link.href = canvas.toDataURL('image/png');
          };
          img.src = link.dataset.originalHref;
        };

        window.addEventListener('DOMContentLoaded', () => {
          updateFavicon();
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);
        });
      })();
    </script>
    <title>Công ty Cổ phần Bao bì Hải Quân</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v6.5.1/css/all.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v6.5.1/css/v4-shims.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Open+Sans%3Aregular%2C600%2C500%2C500%2C500&display=swap"
    />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
